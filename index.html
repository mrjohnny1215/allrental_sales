<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ALL렌탈 Sales Console</title>
<style>
:root{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;color:#182018;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh}.topbar{padding:30px 42px 24px;background:#172019;color:white;display:flex;justify-content:space-between;align-items:flex-end}.topbar h1{margin:5px 0 6px;font-size:28px}.topbar p{margin:0;color:#bfc8be;font-size:14px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:#83a985}.status{padding:9px 12px;border:1px solid #3d4a3e;border-radius:999px;font-size:12px;color:#d7dfd6}main{padding:22px 28px 48px;max-width:1500px;margin:auto}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.stats>div{background:white;border:1px solid #e0e5dd;border-radius:14px;padding:18px}.stats b{font-size:24px;display:block}.stats span{font-size:12px;color:#758075}.workspace{display:grid;grid-template-columns:310px 1fr;gap:14px}.panel,.results{background:white;border:1px solid #e0e5dd;border-radius:16px}.controls{padding:18px;height:max-content;position:sticky;top:14px}.panel-title{margin-bottom:20px;font-weight:800}.controls label{display:block;font-size:12px;font-weight:700;margin:18px 0 8px}.controls label strong{float:right;color:#557b58}.segment-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.segment-grid button,.reset{border:1px solid #dfe5dc;background:#f8faf7;border-radius:9px;padding:10px 8px;font-weight:700;color:#566056;cursor:pointer}.segment-grid button.active{background:#26352a;color:white;border-color:#26352a}select,.search{width:100%;border:1px solid #dfe5dc;border-radius:9px;background:white}.controls select{padding:11px}.search{display:flex;align-items:center;padding:0 10px}.search input{border:0;outline:0;padding:11px 0;width:100%}.controls input[type=range]{width:100%;accent-color:#486c4c}.reset{width:100%;margin-top:16px}.note{margin-top:18px;background:#f2f6f0;border-radius:10px;padding:12px;font-size:12px;color:#627063}.note p{line-height:1.55;margin:5px 0 0}.results{padding:18px}.result-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.result-head h2{margin:4px 0 0;font-size:21px}.result-head>span{font-size:12px;color:#7b847c}.product{display:grid;grid-template-columns:48px 88px 1fr 94px;gap:14px;align-items:center;border-top:1px solid #edf0eb;padding:15px 2px}.product.clickable{cursor:pointer;border-radius:10px;transition:background .16s ease,transform .16s ease}.product.clickable:hover,.product.clickable:focus{background:#f6f8f4;outline:none}.product.clickable:focus-visible{box-shadow:inset 0 0 0 2px #557b58}.rank{font-size:20px;font-weight:900;color:#9aa39a;text-align:center}.product img{width:80px;height:80px;object-fit:contain;border-radius:10px;background:#f8f8f6}.badges{display:flex;gap:5px}.badges span{font-size:10px;background:#eff4ed;border-radius:999px;padding:4px 7px;color:#5f6d60}.info h3{font-size:15px;margin:6px 0 2px}.model{font-size:11px;color:#9aa19a;margin:0 0 6px}.price{font-size:12px}.price b{font-size:16px}.price small{margin-left:8px;color:#7d857d}.commission{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:5px 8px;border-radius:7px;background:#fff6dd;color:#785d13;font-size:11px}.commission b{font-size:13px}.commission.missing{background:#f2f3f1;color:#8a9089}.score-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.score-row span{font-size:10px;padding:4px 6px;border:1px solid #e3e8e0;border-radius:6px;color:#8a928b}.score-row .focus{background:#eef5ec;color:#355638;border-color:#b8ccb5;font-weight:800}.fit{text-align:center}.fit>b{font-size:27px;color:#304e33;display:block}.fit>span{font-size:10px;color:#8b948b}.fit button{margin-top:8px;border:0;background:#243227;color:white;border-radius:8px;padding:8px 7px;font-size:11px;width:100%;cursor:pointer}.empty{padding:80px;text-align:center;color:#7d887d}.error{color:#a33}@media(max-width:900px){.topbar{padding:24px;align-items:flex-start;gap:16px}.stats{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.controls{position:static}.product{grid-template-columns:38px 70px 1fr}.product img{width:64px;height:64px}.fit{grid-column:2/4;display:flex;align-items:center;gap:10px;text-align:left}.fit>b{font-size:20px}.fit button{width:auto;margin:0 0 0 auto}.score-row{display:none}}@media(max-width:600px){main{padding:14px}.topbar{display:block}.status{margin-top:14px;width:max-content}.stats{grid-template-columns:1fr 1fr}.stats>div:first-child{grid-column:1/3}.product{grid-template-columns:28px 1fr}.product img{display:none}.fit{grid-column:2}.result-head{align-items:flex-start}.price small{display:block;margin:4px 0 0}}
</style>
</head>
<body><div class="app"><header class="topbar"><div><span class="eyebrow">PRIVATE SALES TOOL</span><h1>ALL렌탈 Sales Console</h1><p>고객 조건을 넣으면 전체 상품을 다시 채점해 영업 우선순위를 보여줍니다.</p></div><div class="status">🔒 내부 영업용</div></header><main><section id="stats" class="stats"></section><section class="workspace"><aside class="panel controls"><div class="panel-title">⚙ 고객 조건</div><label>추천 목적</label><div id="segments" class="segment-grid"></div><label>제품군</label><select id="category"><option value="all">전체 카테고리</option><option value="water_purifier">정수기</option><option value="air_purifier">공기청정기</option><option value="bidet">비데</option><option value="mattress">매트리스</option></select><label>월 예산 <strong id="budgetText">50,000원</strong></label><input id="budget" type="range" min="10000" max="150000" step="5000" value="50000"><label>브랜드·모델 검색</label><div class="search"><input id="query" placeholder="예: 코웨이, 얼음, BAS25"></div><button id="reset" class="reset">↻ 조건 초기화</button><div class="note"><b>점수 계산</b><p>카테고리 내 가격 위치, 약정 선택폭, 기능 키워드, 고객상황 적합도를 조합한 내부 우선순위 점수입니다.</p></div></aside><section class="results"><div class="result-head"><div><span class="eyebrow">TOP RECOMMENDATIONS</span><h2 id="resultTitle">입주추천</h2></div><span id="candidateCount"></span></div><div id="productList" class="empty">상품 데이터를 불러오는 중...</div></section></section></main></div>
<script src="commission-mapping.js"></script>
<script>
const DATA_URL='https://raw.githubusercontent.com/mrjohnny1215/allrental_customer/main/products_data.json';
const COMMISSION_DATA_URL='commission-map.json';
const categoryLabel={water_purifier:'정수기',air_purifier:'공기청정기',bidet:'비데',mattress:'매트리스',massage_chair:'안마의자'};
const categoryAlias={water:'water_purifier',water_purifier:'water_purifier',purifier:'water_purifier','정수기':'water_purifier',air:'air_purifier',air_purifier:'air_purifier','공기청정기':'air_purifier',bidet:'bidet','비데':'bidet',mattress:'mattress','매트리스':'mattress',massage_chair:'massage_chair',massage:'massage_chair','안마의자':'massage_chair'};
const normalizeCategory=v=>categoryAlias[String(v||'').trim().toLowerCase()]||String(v||'').trim();
const segmentMeta={entry:'입문형',value:'가성비',premium:'프리미엄',baby:'육아추천',newlywed:'신혼추천',movein:'입주추천'};
let allProducts=[], segment='movein';
const $=s=>document.querySelector(s), clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const textOf=p=>`${p.title||''} ${p.desc||''} ${p.model||''}`.toLowerCase();
const hasAny=(t,ws)=>ws.some(w=>t.includes(w));
function enrich(products){products=products.map(p=>({...p,category:normalizeCategory(p.category)}));const usable=products.filter(p=>!p.not_available&&Number(p.price||p.it_price)>0);const groups={};usable.forEach(p=>(groups[p.category]??=[]).push(Number(p.price||p.it_price)));const stats={};Object.entries(groups).forEach(([k,a])=>{a.sort((x,y)=>x-y);const q=x=>a[Math.floor((a.length-1)*x)]||0;stats[k]={min:a[0],median:q(.5),max:a.at(-1)}});return usable.map(p=>{const price=Number(p.price||p.it_price),st=stats[p.category]||{min:0,median:1,max:1},text=textOf(p),periods=p.rentalPeriods?.length||0,low=100*(1-(price-st.min)/Math.max(1,st.max-st.min)),midFit=100-Math.min(100,Math.abs(price-st.median)/Math.max(1,st.median)*90),high=100*((price-st.min)/Math.max(1,st.max-st.min)),hygiene=hasAny(text,['살균','스스로','케어','클린','항균','uv','방수'])?18:0,ice=hasAny(text,['얼음','ice'])?22:0,hot=hasAny(text,['온수','냉온','hot'])?10:0,compact=hasAny(text,['미니','슬림','컴팩트','mini','직수'])?10:0,premiumWord=hasAny(text,['프리미엄','노블','시그니처','아이콘','premium'])?12:0,boost=({water_purifier:{baby:22,newlywed:22,movein:24},air_purifier:{baby:24,newlywed:12,movein:22},bidet:{baby:7,newlywed:8,movein:23},mattress:{baby:5,newlywed:22,movein:10}}[p.category]||{baby:0,newlywed:0,movein:0});return {...p,price,scores:{entry:clamp(low*.78+(periods>=2?12:5)+compact),value:clamp(midFit*.45+low*.30+Math.min(18,periods*5)+hygiene*.35+compact*.25),premium:clamp(high*.62+premiumWord+ice*.65+hygiene*.45),baby:clamp(45+boost.baby+hygiene+hot+compact*.5+low*.12),newlywed:clamp(43+boost.newlywed+ice*.7+premiumWord*.5+compact+midFit*.12),movein:clamp(45+boost.movein+hygiene*.55+compact*.7+Math.min(14,periods*4)+midFit*.12)}}})}
function scenarioCopy(p){const opener={baby:'아이 있는 집이면 월요금만 보기보다 관리·위생 기능까지 같이 보시는 게 좋아요.',newlywed:'신혼집은 초기비용을 줄이면서 디자인과 기능 균형을 맞추는 게 좋아요.',movein:'입주 때는 설치일정과 월 부담을 같이 보고 한 번에 정리하는 게 편해요.',entry:'처음 렌탈하시면 월 부담이 낮고 조건이 단순한 제품부터 보시는 게 편해요.',value:'가격과 기능 균형으로 보면 이 제품이 비교 후보에 들어갈 만해요.',premium:'기능과 사용 편의를 우선하시면 프리미엄 쪽에서 이 제품을 먼저 비교해볼 만해요.'}[segment];return `${opener}\n\n${p.title}\n월 ${p.price.toLocaleString()}원 / 약정 ${(p.rentalPeriods||[]).join('·')||'조건 확인'}\n\n${categoryLabel[p.category]||p.category} 중 현재 조건 기준 추천점수 ${p.scores[segment]}점입니다. 같은 조건의 대체상품 2개도 같이 비교해드릴게요.`}
function safeProductUrl(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return ''}}
function render(){
  const cat=$('#category').value,budget=Number($('#budget').value),q=$('#query').value.trim().toLowerCase();
  $('#budgetText').textContent=budget.toLocaleString()+'원';
  $('#resultTitle').textContent=segmentMeta[segment]+' 추천';
  document.querySelectorAll('[data-segment]').forEach(b=>b.classList.toggle('active',b.dataset.segment===segment));
  const results=allProducts.filter(p=>cat==='all'||p.category===cat).filter(p=>!q||textOf(p).includes(q)||String(p.brand||'').toLowerCase().includes(q)).map(p=>({...p,fit:clamp(p.scores[segment]-(p.price>budget?Math.min(45,(p.price-budget)/1000*2.5):0))})).sort((a,b)=>b.fit-a.fit||a.price-b.price);
  $('#candidateCount').textContent=results.length+'개 후보';
  const top=results.slice(0,6);
  $('#productList').className='';
  $('#productList').innerHTML=top.map((p,i)=>{const canOpen=Boolean(safeProductUrl(p.url));return `<article class="product ${canOpen?'clickable':''}" ${canOpen?`data-open="${i}" tabindex="0" role="link"`:''}><div class="rank">#${i+1}</div><img src="${p.image||''}" onerror="this.style.visibility='hidden'"><div class="info"><div class="badges"><span>${categoryLabel[p.category]||p.category}</span><span>${p.brand||''}</span></div><h3>${p.title||''}</h3><p class="model">${p.model||''}</p><div class="price">월 <b>${p.price.toLocaleString()}원</b> <small>${(p.rentalPeriods||[]).join(' · ')}</small></div><div class="commission ${p.commission==null?'missing':''}">${p.commission==null?'수수료 미등록':`최대 수수료 <b>${p.commission.toLocaleString()}원</b>`}</div><div class="score-row">${Object.entries(p.scores).map(([k,v])=>`<span class="${k===segment?'focus':''}">${segmentMeta[k]} ${v}</span>`).join('')}</div></div><div class="fit"><b>${p.fit}</b><span>적합도</span><button data-copy="${i}">상담멘트 복사</button></div></article>`}).join('');
  document.querySelectorAll('[data-open]').forEach(card=>{const open=()=>window.open(safeProductUrl(top[Number(card.dataset.open)]?.url),'_blank','noopener,noreferrer');card.onclick=e=>{if(!e.target.closest('button'))open()};card.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();open()}}});
  document.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=async e=>{e.stopPropagation();const p=top[Number(btn.dataset.copy)];await navigator.clipboard.writeText(scenarioCopy(p));btn.textContent='복사됨 ✓';setTimeout(()=>btn.textContent='상담멘트 복사',1100)})
}
function initUI(){const labels={entry:'💸 입문형',value:'✨ 가성비',premium:'👑 프리미엄',baby:'👶 육아추천',newlywed:'💍 신혼추천',movein:'🏠 입주추천'};$('#segments').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-segment="${k}">${v}</button>`).join('');document.querySelectorAll('[data-segment]').forEach(b=>b.onclick=()=>{segment=b.dataset.segment;render()});['category','budget','query'].forEach(id=>$('#'+id).addEventListener(id==='query'?'input':'change',render));$('#budget').addEventListener('input',render);$('#reset').onclick=()=>{$('#category').value='all';$('#budget').value=50000;$('#query').value='';segment='movein';render()}}
initUI();
Promise.all([
  fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('상품 데이터를 불러오지 못했습니다.');return r.json()}),
  fetch(COMMISSION_DATA_URL).then(r=>r.ok?r.json():{entries:[]}).catch(()=>({entries:[]})),
]).then(([products,commissionData])=>{allProducts=enrich(CommissionMapping.attachCommissions(products,commissionData));const c=allProducts.reduce((a,p)=>(a[p.category]=(a[p.category]||0)+1,a),{});$('#stats').innerHTML=`<div><b>${allProducts.length}</b><span>판매 가능 상품</span></div><div><b>${c.water_purifier||0}</b><span>정수기</span></div><div><b>${c.air_purifier||0}</b><span>공기청정기</span></div><div><b>${c.bidet||0}</b><span>비데</span></div><div><b>${c.mattress||0}</b><span>매트리스</span></div>`;render()}).catch(e=>{$('#productList').className='empty error';$('#productList').textContent=e.message});
</script></body></html>
